<!-- Theme Initialization (prevents flickering) -->
<script>
  (function() {
    const theme = localStorage.getItem('theme') || 'light';
    if (theme === 'dark') {
      document.documentElement.classList.add('dark-mode');
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.classList.remove('dark-mode');
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<!-- Dynamic Platform SEO & Meta Configurations -->
<meta name="description" content="{% block seo_description %}{{ platform_settings.seo_meta_description }}{% endblock %}">
<meta name="keywords" content="{% block seo_keywords %}{{ platform_settings.seo_meta_keywords }}{% endblock %}">
<link rel="manifest" href="/manifest.json">

<meta property="og:type" content="website">

<meta property="og:image" content="{{ platform_settings.seo_og_image or url_for('static', filename='images/logo.png', _external=True) }}">

<meta name="twitter:image" content="{{ platform_settings.seo_og_image or url_for('static', filename='images/logo.png', _external=True) }}">

<!-- Consent-Gated Google Analytics (gtag.js) & Facebook Pixel (fbq) -->
{% if platform_settings.google_analytics_id or platform_settings.facebook_pixel_id %}
<script>
  (function() {
    var gaId = {{ (platform_settings.google_analytics_id or '') | tojson }};
    var fbPixelId = {{ (platform_settings.facebook_pixel_id or '') | tojson }};
    var gaLoaded = false;
    var fbLoaded = false;

    function readCookieConsent() {
      try {
        var match = document.cookie.match(/(?:^|;\s*)pb_cookie_consent=([^;]+)/);
        if (match && match[1]) {
          var parsed = JSON.parse(decodeURIComponent(match[1]));
          if (parsed && typeof parsed === 'object') return parsed;
        }
      } catch (e) {}
      try {
        var stored = localStorage.getItem('pb_cookie_consent');
        if (stored) {
          var parsedLs = JSON.parse(stored);
          if (parsedLs && typeof parsedLs === 'object') return parsedLs;
        }
      } catch (e) {}
      return null;
    }

    function loadGoogleAnalytics() {
      if (!gaId || gaLoaded) return;
      gaLoaded = true;
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gaId);
      document.head.appendChild(script);

      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function() { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', gaId);
    }

    function loadFacebookPixel() {
      if (!fbPixelId || fbLoaded) return;
      fbLoaded = true;
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init', fbPixelId);
      window.fbq('track', 'PageView');
    }

    function applyConsent(consent) {
      if (!consent || typeof consent !== 'object') return;
      if (consent.analytics === true) {
        if (gaId) window['ga-disable-' + gaId] = false;
        loadGoogleAnalytics();
      } else if (gaId) {
        window['ga-disable-' + gaId] = true;
      }
      if (consent.marketing === true) {
        loadFacebookPixel();
      }
    }

    applyConsent(readCookieConsent());

    window.addEventListener('cookieConsentUpdated', function(event) {
      if (event && event.detail) {
        applyConsent(event.detail);
      }
    });
  })();
</script>
{% endif %}

<!-- Global CSRF Protection Configuration -->
{% if csrf_token %}
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
  (function() {
    // Override window.fetch to automatically include CSRF token for non-GET requests
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
      init = init || {};
      const method = (init.method || 'GET').toUpperCase();
      if (method !== 'GET' && method !== 'HEAD') {
        init.headers = init.headers || {};
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
        if (csrfToken) {
          // Handle both Headers object and plain object
          if (init.headers instanceof Headers) {
            init.headers.set('X-CSRF-Token', csrfToken);
          } else {
            init.headers['X-CSRF-Token'] = csrfToken;
          }
        }
      }
      return originalFetch(input, init);
    };
  })();
</script>
{% endif %}
