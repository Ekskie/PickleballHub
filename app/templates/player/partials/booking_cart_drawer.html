<div id="reservationDrawerOverlay" onclick="closeResDrawer()"></div>
<aside id="reservationDrawer" aria-label="Bookings Cart Drawer">
    <!-- Header -->
    <div class="res-drawer-header">
        <div class="res-drawer-header-left">

            <button type="button" class="drawer-btn-icon" onclick="refreshDrawerBookings()" id="btnRefreshDrawer" title="Refresh Bookings" aria-label="Refresh Bookings">

    <div class="res-drawer-tabs">
        <button type="button" class="drawer-tab active" data-filter="all" onclick="filterDrawerBookings('all', this)">

        </button>
        <button type="button" class="drawer-tab" data-filter="pending" onclick="filterDrawerBookings('pending', this)">

            <span class="drawer-tab-count" id="count-pending">0</span>

<script>
    (function() {
        let currentDrawerFilter = 'all';

        function getCsrfToken() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.getAttribute('content') : '';
        }

        window.toggleResDrawer = function(forceState) {
            const overlay = document.getElementById('reservationDrawerOverlay');
            const drawer = document.getElementById('reservationDrawer');
            if (!overlay || !drawer) return;

            const isOpen = drawer.classList.contains('open');
            const shouldOpen = typeof forceState === 'boolean' ? forceState : !isOpen;

            if (shouldOpen) {
                overlay.classList.add('open');
                drawer.classList.add('open');
                document.body.style.overflow = 'hidden';
            } else {
                overlay.classList.remove('open');
                drawer.classList.remove('open');
                document.body.style.overflow = '';
            }
        };

        window.closeResDrawer = function() {
            window.toggleResDrawer(false);
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.closeResDrawer();
        });

        window.filterDrawerBookings = function(filter, btn) {
            currentDrawerFilter = filter;
            document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const cards = document.querySelectorAll('.drawer-booking-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const status = card.dataset.status;
                let show = false;
                if (filter === 'all') {
                    show = true;
                } else if (filter === 'pending') {
                    show = (status === 'pending_payment' || status === 'pending_verification');
                } else if (filter === 'confirmed') {
                    show = (status === 'confirmed');
                } else if (filter === 'cancelled') {
                    show = (status === 'cancelled' || status === 'declined');
                }
                card.style.display = show ? 'block' : 'none';
                if (show) visibleCount++;
            });

            const emptyMsg = document.getElementById('drawerEmptyMsg');
            if (emptyMsg) {
                emptyMsg.style.display = (cards.length === 0 || visibleCount === 0) ? 'block' : 'none';
            }
        };

        window.refreshDrawerBookings = async function() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('ph-spin');

            try {
                const resp = await fetch('/player/reservation/api/my-bookings');
                if (!resp.ok) throw new Error('Failed to fetch bookings');
                const bookings = await resp.json();
                renderDrawerBookings(bookings);
            } catch (err) {
                console.error('Error refreshing bookings:', err);
            } finally {
                if (icon) {
                    setTimeout(() => icon.classList.remove('ph-spin'), 400);
                }
            }
        };

        function formatTime12(s) {
            if (!s) return '';
            try {
                const parts = String(s).split(':');
                let h = parseInt(parts[0], 10);
                let m = parseInt(parts[1], 10) || 0;
                let ampm = (h >= 12 && h < 24) ? 'PM' : 'AM';
                let h12 = h % 12;
                if (h12 === 0) h12 = 12;
                let minStr = m > 0 ? `:${String(m).padStart(2, '0')}` : ':00';
                return `${h12}${minStr} ${ampm}`;
            } catch(e) {
                return s;
            }
        }

        window.renderDrawerBookings = function(bookings) {
            const container = document.getElementById('drawerBookingList');
            if (!container) return;

            let pendingCount = 0;
            let confirmedCount = 0;
            let cancelledCount = 0;

            (bookings || []).forEach(b => {
                const s = b.display_status || b.status;
                if (s === 'pending_payment' || s === 'pending_verification') pendingCount++;
                else if (s === 'confirmed') confirmedCount++;
                else if (s === 'cancelled' || s === 'declined') cancelledCount++;
            });

            // Update badge counts
            const badge1 = document.getElementById('cartCountBadge');
            const badge2 = document.getElementById('floatingBadgeCount');
            const cAll = document.getElementById('count-all');
            const cPending = document.getElementById('count-pending');
            const cConfirmed = document.getElementById('count-confirmed');
            const cCancelled = document.getElementById('count-cancelled');
            const subtext = document.getElementById('headerCartSubtext');
            const floatStatus = document.getElementById('floatingWidgetStatus');
            const pulseDot = document.getElementById('floatingCartPulseDot');

            const totalCount = (bookings || []).length;
            if (badge1) badge1.textContent = totalCount;
            if (badge2) badge2.textContent = totalCount;
            if (cAll) cAll.textContent = totalCount;
            if (cPending) cPending.textContent = pendingCount;
            if (cConfirmed) cConfirmed.textContent = confirmedCount;
            if (cCancelled) cCancelled.textContent = cancelledCount;

            // Pulse dot control
            if (pulseDot) {
                if (pendingCount > 0) {
                    pulseDot.style.display = 'block';
                    pulseDot.className = 'cart-pulse-dot pending';
                } else if (confirmedCount > 0) {
                    pulseDot.style.display = 'block';
                    pulseDot.className = 'cart-pulse-dot confirmed';
                } else {
                    pulseDot.style.display = 'none';
                }
            }

            // Subtext on reservation page header
            if (subtext) {
                if (totalCount === 0) subtext.textContent = 'No active bookings';
                else if (pendingCount > 0) subtext.innerHTML = `<span style="color:#d97706;font-weight:700;">${pendingCount} Pending</span>`;
                else if (confirmedCount > 0) subtext.innerHTML = `<span style="color:#16a34a;font-weight:700;">${confirmedCount} Accepted</span>`;
                else subtext.textContent = `${totalCount} Total`;
            }

            // Subtext on floating button
            if (floatStatus) {
                if (pendingCount > 0) floatStatus.textContent = `${pendingCount} Pending Review`;
                else if (confirmedCount > 0) floatStatus.textContent = `${confirmedCount} Confirmed`;
                else floatStatus.textContent = `${totalCount} Active`;
            }

            if (!bookings || bookings.length === 0) {
                container.innerHTML = `
                    <div class="drawer-empty" id="drawerEmptyMsg">
                        <div class="drawer-empty-icon"><i class="ph ph-tennis-ball"></i></div>
                        <h4 style="font-size:1rem;font-weight:700;color:var(--text-primary);margin-bottom:6px;">No bookings in cart yet</h4>
                        <p style="font-size:0.8rem;line-height:1.4;margin-bottom:14px;">Pick a facility, choose a date &amp; court, and place your reservation. It will float right here so you can track its status instantly!</p>
                        <a href="/player/reservation" class="drawer-action-btn pay" style="display:inline-flex;margin:0 auto;text-decoration:none;"><i class="ph ph-calendar-plus"></i> Book a Court Now</a>
                    </div>
                `;
                return;
            }

            const csrfToken = getCsrfToken();
            let html = '';
            bookings.forEach(r => {
                const court = r.courts || {};
                const fac = r.facilities || {};
                const dispStatus = r.display_status || r.status;
                const courtName = court.name || 'Court';
                const facName = fac.name || 'Pickleball Facility';
                const courtType = court.type ? `&bull; <span style="text-transform:capitalize;">${court.type}</span>` : '';
                const totalAmt = parseFloat(r.total_amount || 0).toFixed(2);
                const startTime12 = r.start_time_12 || formatTime12(r.start_time);
                const endTime12 = r.end_time_12 || formatTime12(r.end_time);
                const hrs = parseInt(r.total_hours || 1, 10);

                let statusBadge = '';
                let statusDesc = '';

                if (dispStatus === 'pending_payment') {
                    statusBadge = '<span class="badge-status-pill pending-pay"><i class="ph ph-hourglass-medium"></i> PENDING PAYMENT</span>';
                    statusDesc = '<div class="drawer-card-status-desc pending-pay"><i class="ph ph-warning-circle" style="font-size:1rem;flex-shrink:0;"></i><div><strong>GCash payment needed!</strong> Complete payment so the facility owner can confirm your court.</div></div>';
                } else if (dispStatus === 'pending_verification') {
                    statusBadge = '<span class="badge-status-pill pending-verif"><i class="ph ph-clock-countdown"></i> PENDING APPROVAL</span>';
                    statusDesc = `<div class="drawer-card-status-desc pending-verif"><i class="ph ph-clock" style="font-size:1rem;flex-shrink:0;"></i><div><strong>Ref submitted:</strong> ${r.gcash_ref || ''}. Waiting for the manager to verify and approve.</div></div>`;
                } else if (dispStatus === 'confirmed') {
                    statusBadge = '<span class="badge-status-pill accepted"><i class="ph ph-check-circle"></i> ACCEPTED</span>';
                    statusDesc = '<div class="drawer-card-status-desc accepted"><i class="ph ph-check-circle" style="font-size:1rem;flex-shrink:0;"></i><div><strong>Booking accepted!</strong> Your court is reserved and waiting for you.</div></div>';
                } else if (dispStatus === 'cancelled' || dispStatus === 'declined') {
                    statusBadge = '<span class="badge-status-pill declined"><i class="ph ph-x-circle"></i> DECLINED</span>';
                    statusDesc = '<div class="drawer-card-status-desc declined"><i class="ph ph-x-circle" style="font-size:1rem;flex-shrink:0;"></i><div><strong>Booking declined/cancelled.</strong> You can choose another court or time slot anytime.</div></div>';
                } else {
                    statusBadge = `<span class="badge-status-pill completed"><i class="ph ph-check"></i> ${(dispStatus||'').toUpperCase()}</span>`;
                }

                let actionBtns = '';
                if (dispStatus === 'pending_payment' && !r.gcash_ref) {
                    actionBtns += `<a href="/player/reservation/payment/${r.id}" class="drawer-action-btn pay"><i class="ph ph-device-mobile-camera"></i> Pay via GCash</a>`;
                }
                if (r.can_cancel && (dispStatus === 'pending_payment' || dispStatus === 'confirmed') && !r.gcash_ref) {
                    actionBtns += `
                        <form method="POST" action="/player/reservation/cancel/${r.id}" onsubmit="return confirm('Cancel this reservation?');" style="margin:0;">
                            <input type="hidden" name="csrf_token" value="${csrfToken}">
                            <button type="submit" class="drawer-action-btn cancel"><i class="ph ph-x"></i> Cancel</button>
                        </form>
                    `;
                }

                html += `
                    <div class="drawer-booking-card" data-status="${dispStatus}" data-id="${r.id}">
                        <div class="drawer-card-top">
                            <div>
                                <div class="drawer-card-facility">${facName}</div>
                                <div class="drawer-card-court">
                                    <i class="ph ph-tennis-ball"></i> ${courtName} ${courtType}
                                </div>
                            </div>
                            ${statusBadge}
                        </div>

                        <div class="drawer-card-info-grid">
                            <div class="drawer-card-info-item">
                                <i class="ph ph-calendar"></i>
                                <span>${r.date}</span>
                            </div>
                            <div class="drawer-card-info-item">
                                <i class="ph ph-clock"></i>
                                <span>${startTime12} – ${endTime12}</span>
                            </div>
                            <div class="drawer-card-info-item">
                                <i class="ph ph-hourglass"></i>
                                <span>${hrs} hr${hrs !== 1 ? 's' : ''}</span>
                            </div>
                            <div class="drawer-card-info-item">
                                <i class="ph ph-currency-circle-dollar"></i>
                                <span><strong>₱${totalAmt}</strong></span>
                            </div>
                        </div>

                        ${statusDesc}

                        <div class="drawer-card-actions">
                            <div class="drawer-price">₱${totalAmt}</div>
                            <div style="display:flex;align-items:center;gap:6px;">
                                ${actionBtns}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            window.filterDrawerBookings(currentDrawerFilter, document.querySelector(`.drawer-tab[data-filter="${currentDrawerFilter}"]`));
        };

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            window.refreshDrawerBookings();

            // Auto-open if query param is set
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('open_cart') === '1' || urlParams.get('cart') === '1') {
                setTimeout(() => window.toggleResDrawer(true), 150);
            }

            // Periodic background check every 30 seconds
            setInterval(() => {
                if (!document.hidden) {
                    window.refreshDrawerBookings();
                }
            }, 30000);

            // Refresh when user tabs back
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    window.refreshDrawerBookings();
                }
            });
        });
    })();
</script>
